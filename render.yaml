services:
  - type: web
    name: recipebot
    runtime: python
    plan: free
    rootDir: bot
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: ALLOWED_NUMBERS
        sync: false
      - key: SITE_URL
        value: https://shaharfranses.github.io/RecipeBot
